[package]
name = "tidybeam"
version = "0.3.0"
description = "A fast, local-first file manager for Windows, macOS and Linux"
authors = ["TidyBeam contributors"]
license = "MIT"
edition = "2024"
publish = false

[lib]
# The `_lib` suffix keeps the library name distinct from the binary on Windows,
# see https://github.com/rust-lang/cargo/issues/8519
name = "tidybeam_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dunce = "1"
jwalk = "0.9"
notify = "8"
rayon = "1"
rusqlite = { version = "0.43", features = ["bundled-full", "fallible_uint"] }
sha2 = "0.11"
sysinfo = "0.37"
trash = "5"
walkdir = "2"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
zip = { version = "9", default-features = false, features = ["deflate"] }

# https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

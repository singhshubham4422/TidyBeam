[workspace]
members = [".", "crates/tidybeam-core", "crates/tidybeam-cli"]

[package]
name = "tidybeam"
version = "0.4.1"
description = "A fast, local-first file manager for Windows, macOS and Linux"
authors = ["TidyBeam contributors"]
license = "MIT"
edition = "2024"
publish = false

[lib]
# The `_lib` suffix keeps the library name distinct from the binary on Windows,
# see https://github.com/rust-lang/cargo/issues/8519
name = "tidybeam_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
dunce = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "ico"] }
jwalk = "0.9"
notify = "8"
rayon = "1"
rusqlite = { version = "0.43", features = ["bundled-full", "fallible_uint"] }
sysinfo = "0.37"
tidybeam-core = { path = "crates/tidybeam-core" }
trash = "5"
walkdir = "2"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
zip = { version = "9", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
